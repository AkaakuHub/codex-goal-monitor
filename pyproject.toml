[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-goal-monitor"
version = "0.2.0"
description = "Codex Goalの監視・復旧とDiscord通知"
requires-python = ">=3.12"
dependencies = [
  "PySide6-Essentials>=6.8,<7",
  "QtAwesome>=1.4,<2",
  "platformdirs>=4.3,<5",
  "websockets>=15,<17",
]

[project.optional-dependencies]
build = ["Nuitka>=4.3,<5", "ordered-set>=4,<5", "zstandard>=0.23,<1"]
dev = ["ruff>=0.14,<1"]

[project.gui-scripts]
codex-goal-monitor = "monitor.desktop.app:main"

[tool.setuptools.packages.find]
include = ["monitor*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

