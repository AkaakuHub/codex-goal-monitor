name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15
            target: macos-arm64
          - runner: macos-15-intel
            target: macos-x64
          - runner: windows-2022
            target: windows-x64
            rustflags: -C target-feature=+crt-static
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v6
      - name: Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +stable fmt --check
      - name: Clippy
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo +stable test --locked
      - name: Build
        run: cargo +stable build --release --locked
      - name: 起動とバージョンを確認
        if: runner.os != 'Windows'
        run: |
          target/release/codex-goal-monitor --help
          expected=$(cargo +stable metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "codex-goal-monitor"))')
          actual=$(target/release/codex-goal-monitor --version)
          test "$actual" = "$expected"
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "v$expected"; fi
          echo "Version: $actual"
          echo "APP_VERSION=$expected" >> "$GITHUB_ENV"
      - name: Windowsで起動とバージョンを確認
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $metadata = cargo +stable metadata --no-deps --format-version 1 | ConvertFrom-Json
          $expected = ($metadata.packages | Where-Object name -EQ 'codex-goal-monitor').version
          $process = Start-Process target/release/codex-goal-monitor.exe -ArgumentList '--version' -WindowStyle Hidden -RedirectStandardOutput target/version.txt -RedirectStandardError target/version-error.txt -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw (Get-Content target/version-error.txt -Raw) }
          $actual = (Get-Content target/version.txt -Raw).Trim()
          if ($actual -ne $expected) { throw "バージョンが一致しません。expected=$expected actual=$actual" }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$expected") { throw 'タグとCargoのバージョンが一致しません。' }
          Write-Output "Version: $actual"
          "APP_VERSION=$expected" >> $env:GITHUB_ENV
      - name: Linux・macOSで自動起動の切り替えを確認
        if: runner.os != 'Windows'
        shell: bash
        run: |
          settings="$PWD/target/startup check/settings.json"
          mkdir -p "$(dirname "$settings")"
          echo '{"webhook_url":"https://discord.com/api/webhooks/123/test","sender_label":"CI","autostart":false}' > "$settings"
          if [ "$RUNNER_OS" = Linux ]; then
            sudo systemctl start "user@$(id -u).service"
            export XDG_RUNTIME_DIR="/run/user/$(id -u)"
            export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          fi
          target/release/codex-goal-monitor --headless --config "$settings" --autostart on
          if [ "$RUNNER_OS" = Linux ]; then
            systemctl --user is-enabled --quiet codex-goal-monitor.service
            systemd-analyze --user verify "$HOME/.config/systemd/user/codex-goal-monitor.service"
            trap 'systemctl --user stop codex-goal-monitor.service' EXIT
            systemctl --user start codex-goal-monitor.service
            sleep 2
            systemctl --user is-active --quiet codex-goal-monitor.service
            pid=$(systemctl --user show -p MainPID --value codex-goal-monitor.service)
            test "$(stat -c %u "/proc/$pid")" = "$(id -u)"
            systemctl --user stop codex-goal-monitor.service
          else
            plutil -lint "$HOME/Library/LaunchAgents/org.akaakuhub.codex-goal-monitor.plist"
          fi
          target/release/codex-goal-monitor --headless --config "$settings" --autostart status
          target/release/codex-goal-monitor --headless --config "$settings" --autostart off
          if [ "$RUNNER_OS" = Linux ]; then
            if systemctl --user is-enabled --quiet codex-goal-monitor.service; then exit 1; fi
          else
            test ! -e "$HOME/Library/LaunchAgents/org.akaakuhub.codex-goal-monitor.plist"
          fi
      - name: Windowsで自動起動の切り替えを確認
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $settings = "$PWD/target/startup check/settings.json"
          New-Item -ItemType Directory -Force (Split-Path $settings)
          '{"webhook_url":"https://discord.com/api/webhooks/123/test","sender_label":"CI","autostart":false}' | Set-Content $settings
          foreach ($mode in @('on', 'off')) {
            $process = Start-Process target/release/codex-goal-monitor.exe -ArgumentList '--headless', '--config', "`"$settings`"", '--autostart', $mode -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "自動起動の${mode}に失敗しました。" }
            $saved = Get-Content $settings -Raw | ConvertFrom-Json
            if ($saved.autostart -ne ($mode -eq 'on')) { throw '自動起動の設定が保存されていません。' }
            $key = Get-Item 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
            $registered = $key.GetValue('Codex Goal Monitor')
            if (($null -ne $registered) -ne ($mode -eq 'on')) { throw '自動起動の登録状態が正しくありません。' }
          }
          $monitor = Start-Process target/release/codex-goal-monitor.exe -ArgumentList '--headless', '--config', "`"$settings`"" -WindowStyle Hidden -RedirectStandardError target/monitor-error.txt -PassThru
          try {
            Start-Sleep -Seconds 2
            if ($monitor.HasExited) { throw (Get-Content target/monitor-error.txt -Raw) }
            $duplicate = Start-Process target/release/codex-goal-monitor.exe -ArgumentList '--headless', '--config', "`"$settings`"" -WindowStyle Hidden -RedirectStandardError target/duplicate-error.txt -PassThru
            try {
              if (-not $duplicate.WaitForExit(10000)) { throw '多重起動が終了しません。' }
              if ($duplicate.ExitCode -eq 0) { throw '多重起動が拒否されません。' }
            } finally {
              if (-not $duplicate.HasExited) { Stop-Process -Id $duplicate.Id }
            }
          } finally {
            if (-not $monitor.HasExited) { Stop-Process -Id $monitor.Id }
          }
      - name: Linux用に圧縮
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf dist/codex-goal-monitor-${{ matrix.target }}.tar.gz -C target/release codex-goal-monitor
      - name: macOS用のアプリを作成
        if: runner.os == 'macOS'
        run: |
          app="target/package/root/Applications/Codex Goal Monitor.app"
          mkdir -p "$app/Contents/MacOS" dist
          cp target/release/codex-goal-monitor "$app/Contents/MacOS/"
          cp deploy/macos/Info.plist "$app/Contents/"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist")" = "$APP_VERSION"
          test "$(plutil -extract CFBundleVersion raw -o - "$app/Contents/Info.plist")" = "$APP_VERSION"
          codesign --force --deep --sign - "$app"
          pkgbuild --analyze --root target/package/root target/package/components.plist
          /usr/libexec/PlistBuddy -c 'Set :0:BundleIsRelocatable false' target/package/components.plist
          pkgbuild --root target/package/root --component-plist target/package/components.plist --identifier org.akaakuhub.codex-goal-monitor --version "$APP_VERSION" --install-location / target/package/component.pkg
          sed "s/@VERSION@/$APP_VERSION/g" deploy/macos/Distribution.xml > target/package/Distribution.xml
          productbuild --distribution target/package/Distribution.xml --package-path target/package dist/codex-goal-monitor-${{ matrix.target }}.pkg
      - name: macOSでユーザー専用インストールを確認
        if: runner.os == 'macOS'
        run: |
          test "$(id -u)" -ne 0
          installer -pkg dist/codex-goal-monitor-${{ matrix.target }}.pkg -target CurrentUserHomeDirectory
          binary="$HOME/Applications/Codex Goal Monitor.app/Contents/MacOS/codex-goal-monitor"
          test "$("$binary" --version)" = "$APP_VERSION"
          codesign --verify --deep --strict "$HOME/Applications/Codex Goal Monitor.app"
          "$binary" --headless --config "$PWD/target/startup check/settings.json" &
          pid=$!
          trap 'kill "$pid"' EXIT
          sleep 2
          kill -0 "$pid"
      - name: Windows用インストーラーを作成
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" "/DAppVersion=$env:APP_VERSION" deploy/windows/setup.iss
          if ($LASTEXITCODE -ne 0) { throw 'インストーラーの生成に失敗しました。' }
      - name: Windowsでインストール・更新・アンインストールを確認
        if: runner.os == 'Windows'
        shell: pwsh
        run: deploy/windows/verify-install.ps1 -Installer "$PWD/dist/codex-goal-monitor-windows-x64-setup.exe" -Version $env:APP_VERSION -WorkDirectory "$PWD/target/install check"
      - uses: actions/upload-artifact@v6
        with:
          name: codex-goal-monitor-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: codex-goal-monitor-*
          path: dist
          merge-multiple: true
      - name: ビルド成果物をReleaseへ公開
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" --generate-notes
