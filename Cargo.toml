[package]
name = "codex-goal-monitor"
version = "0.2.4"
build = "deploy/windows/build.rs"
edition = "2024"
rust-version = "1.90"

[dependencies]
anyhow = "1"
dirs = "6"
futures-util = { version = "0.3", features = ["sink"] }
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
uds-compat = "0.1"
ureq = { version = "3.5", default-features = false, features = ["rustls", "json"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tao = { version = "0.37", default-features = false }
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows-registry = "0.6"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
plist = { version = "1", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.clippy]
all = "warn"
